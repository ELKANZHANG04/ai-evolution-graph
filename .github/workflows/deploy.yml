name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每日数据刷新检查（部署后生效）：北京时间 08:30
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate data
        run: pnpm run validate:strict

      - name: Unit tests
        run: pnpm test

      # 可选：用智谱 GLM-4.7-Flash（免费）生成条目语义关键词，供「我的灵感」做 AI 联系
      # 未配置 ZHIPU_API_KEY / API 失败时保留种子数据，不影响部署
      - name: AI semantic links (optional)
        continue-on-error: true
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: pnpm run ai:links

      - name: Build
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
